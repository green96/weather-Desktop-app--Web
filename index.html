<!DOCTYPE html>

<head>

<body>

    

    <!--Tạo 1 cái form có class là weatherForm-->
    <form class="weatherForm">

        <!--Hộp thoại text (textbox để input text)-->
        <!--placeholder là gợi ý cần nhập gì vào ô textbox-->
        <input type="text" class="cityInput" placeholder="Enter city">
        
        <!--
        Thuộc tính type="submit" chỉ định rằng nút này là nút gửi form.
        Khi nhấn nút, nó sẽ gửi form chứa nó (gửi dữ liệu tới server hoặc gọi JavaScript xử lý form).
        Nếu nút nằm trong thẻ <form>...</form>, việc nhấn nút sẽ kích hoạt hành động action và method của form.
        -->
        <button id="GetWeatherButton" type="submit">Get Weather</button>

    </form>


    <!--The weather output will display like a card-->
    <div class="card" = "display: none;">
